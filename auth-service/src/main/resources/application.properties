spring.application.name=auth-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/farmatrade_auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:farmatrade_auth_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

initial-admin.name=${INITIAL_ADMIN_NAME:}
initial-admin.email=${INITIAL_ADMIN_EMAIL:}
initial-admin.mobile=${INITIAL_ADMIN_MOBILE:}
initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
initial-admin.aadhaar=${INITIAL_ADMIN_AADHAAR:}

auth.jwt.issuer=${AUTH_JWT_ISSUER:farmatrade-auth-service}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:farmatrade-api}
auth.jwt.kid=${AUTH_JWT_KID:farmatrade-auth-rs256-1}
auth.jwt.access-token-minutes=${AUTH_JWT_ACCESS_TOKEN_MINUTES:15}
auth.jwt.private-key-pem=${AUTH_RSA_PRIVATE_KEY_PEM:}
auth.jwt.private-key-file=${AUTH_RSA_PRIVATE_KEY_FILE:}
auth.jwt.public-key-pem=${AUTH_RSA_PUBLIC_KEY_PEM:}
auth.jwt.public-key-file=${AUTH_RSA_PUBLIC_KEY_FILE:}
auth.jwt.allow-ephemeral-key=${AUTH_JWT_ALLOW_EPHEMERAL_KEY:false}
auth.login.max-failed-attempts=${AUTH_LOGIN_MAX_FAILED_ATTEMPTS:5}
auth.login.lock-minutes=${AUTH_LOGIN_LOCK_MINUTES:15}
auth.cors.allowed-origins=${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
