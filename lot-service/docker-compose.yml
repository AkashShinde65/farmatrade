# Local dev MySQL + app for lot-service. Neither this file nor a Dockerfile existed before this
# fix. Host port note: 3306 is commonly taken by a natively-installed MySQL; 3307 is
# auth-service's, 3308 is logistics-service's, 3309 is billing-service's, 3311 is
# bidding-service's -- this maps lot-service's MySQL to 3310.
#
# Joins the shared "farmatrade-net" external network so this container can resolve auth-service
# (for JWKS) and receive calls from bidding-service by hostname. Create the network once before
# starting any service: docker network create farmatrade-net
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: farmatrade_lot
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - lot-mysql-data:/var/lib/mysql
    # Deliberately NOT on farmatrade-net: every service's DB container was named "mysql" and all
    # joined the same shared network, so Docker's embedded DNS returned multiple IPs for the
    # hostname "mysql" once more than one stack was up at once -- verified empirically via
    # `docker run --network farmatrade-net busybox nslookup mysql`, which returned three different
    # container IPs (logistics/billing/lot), and a real failure where billing-service's app
    # connected to the wrong "mysql" and got "Unknown database 'farmatrade_billing'". The app
    # container only needs to reach ITS OWN db, via the project-private default network Compose
    # creates automatically for this file.

  lot-service:
    build: .
    image: farmatrade-lot-service:dev
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:mysql://mysql:3306/farmatrade_lot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      AUTH_JWT_ISSUER: farmatrade-auth-service
      AUTH_JWT_AUDIENCE: farmatrade-api
      MANDI_API_KEY: ${MANDI_API_KEY:-579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b}
      # Must match the value bidding-service (and logistics-service) send as INTERNAL_SERVICE_TOKEN.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set and must match bidding-service/logistics-service}
    ports:
      - "8082:8082"
    volumes:
      - lot-uploads-data:/app/uploads
    networks:
      - farmatrade-net
      - default

volumes:
  lot-mysql-data:
  lot-uploads-data:

networks:
  farmatrade-net:
    external: true
