spring.application.name=lot-service
server.port=${SERVER_PORT:8082}

# Fixed 2026-07-30: was hardcoded to localhost:3306/lot_db with no env-var override, and 3306 is
# commonly taken by a natively-installed MySQL. Now Docker/env-var driven, matching the rest of
# the fleet, with lot-service's own dedicated port (3310) and a farmatrade_-prefixed DB name
# consistent with farmatrade_billing / farmatrade_bidding.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3310/farmatrade_lot?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ----- Auth Service (OAuth2 Resource Server / JWT) -----
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
auth.jwt.issuer=${AUTH_JWT_ISSUER:farmatrade-auth-service}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:farmatrade-api}

# STOP-GAP service-to-service credential (see bidding-service's WebClientConfig Javadoc for the
# full rationale). Must match the value bidding-service sends as INTERNAL_SERVICE_TOKEN.
internal-service.token=${INTERNAL_SERVICE_TOKEN:CHANGE-ME-INTERIM-SERVICE-TOKEN}

# ----- CORS (frontend origin allow-list) -----
lot.cors.allowed-origins=${LOT_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===============================
# MANDI PRICE API
# ===============================
# Fixed 2026-07-30: API key was hardcoded directly in this committed file; now env-var driven
# matching the rest of the fleet's convention (Razorpay keys, etc. are never hardcoded).
mandi.api.base-url=https://api.data.gov.in
mandi.api.resource-id=9ef84268-d588-465a-a308-a864a43d0070
mandi.api.key=${MANDI_API_KEY:579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b}
