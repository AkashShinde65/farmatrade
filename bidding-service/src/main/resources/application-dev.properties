# ==========================================================
# FarmaTrade - Bidding Service (P3)
# Profile: dev  (local / docker-compose.dev.yml)
# ==========================================================

# ----- MySQL -----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3311}/${DB_NAME:farmatrade_bidding}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:bidding_user}
spring.datasource.password=${DB_PASSWORD:bidding_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ----- Verbose logging for local debugging -----
logging.level.com.farmatrade.bidding=DEBUG
logging.level.org.hibernate.SQL=DEBUG
