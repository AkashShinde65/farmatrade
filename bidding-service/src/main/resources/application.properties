# ==========================================================
# FarmaTrade - Bidding Service (P3)
# Base configuration - shared across all profiles
# ==========================================================

spring.application.name=bidding-service
server.port=8083

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# ----- Jackson -----
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ----- Actuator (Docker health checks) -----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# ----- Auth Service (OAuth2 Resource Server / JWT) -----
# Path fixed 2026-07-30: auth-service's real, published JWKS endpoint is
# /.well-known/jwks.json (see auth-service's JwksController) -- this
# previously pointed at /oauth2/jwks, a Spring Authorization Server
# convention auth-service does not use, so every JWKS fetch would 404 and
# ALL token verification would fail, not just role-based checks.
auth.jwks-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
# Fixed 2026-07-30: auth-service's JwtUtil signs tokens with .issuer("farmatrade-auth-service")
# (a plain string, not a URL) -- this previously used http://localhost:8081, so the issuer
# check would reject every genuine token from auth-service.
auth.issuer-uri=${AUTH_ISSUER_URI:farmatrade-auth-service}
auth.audience=farmatrade-api

# ----- Downstream service integration -----
lot-service.base-url=${LOT_SERVICE_BASE_URL:http://localhost:8082}
# Bidding Service notifies Logistics Service (not Billing Service) the instant a sale closes -
# see AuctionClosingService/LogisticsServiceClient Javadoc for why.
logistics-service.base-url=${LOGISTICS_SERVICE_BASE_URL:http://localhost:8084}
webclient.timeout.connect-ms=3000
webclient.timeout.response-ms=5000

# STOP-GAP service-to-service credential, see WebClientConfig Javadoc.
# There is no real service-credential flow yet; this static token is
# attached as "Authorization: Bearer <token>" on every outbound call to
# Lot Service / Logistics Service. MUST be overridden via the
# INTERNAL_SERVICE_TOKEN env var in every real environment and must match
# whatever Lot Service / Logistics Service / Billing Service expect on
# their internal endpoints.
internal-service.token=${INTERNAL_SERVICE_TOKEN:CHANGE-ME-INTERIM-SERVICE-TOKEN}

# ----- Auction business rules -----
auction.anti-snipe.window-seconds=30
auction.anti-snipe.extension-minutes=2
auction.scheduler.fixed-rate-ms=5000

# UNCONFIRMED placeholder rates used only to populate the gst/platformFee/
# totalAmount fields Billing Service's /internal/sale contract requires -
# see LotWonNotification and AuctionClosingService Javadoc. Forwarded
# through Logistics Service unchanged. Do not treat these as real business
# rates until Billing/Product confirm.
billing.gst-rate=0.05
billing.platform-fee-rate=0.02

# ----- Logging -----
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n
logging.level.com.farmatrade.bidding=INFO
logging.level.org.springframework.security=INFO
