spring.datasource.url=jdbc:h2:mem:bidding_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Dummy values - no real Auth Service call happens in tests since
# SecurityMockMvcRequestPostProcessors.jwt() injects the Authentication
# directly and bypasses real JWKS-based token verification.
auth.jwks-uri=http://localhost:9999/oauth2/jwks
auth.issuer-uri=http://localhost:9999
auth.audience=farmatrade-api

lot-service.base-url=http://localhost:9998
logistics-service.base-url=http://localhost:9997
webclient.timeout.connect-ms=1000
webclient.timeout.response-ms=1000
internal-service.token=test-internal-token

auction.anti-snipe.window-seconds=30
auction.anti-snipe.extension-minutes=2
auction.scheduler.fixed-rate-ms=5000
