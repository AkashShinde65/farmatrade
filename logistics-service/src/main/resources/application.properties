spring.application.name=logistics-service
server.port=${SERVER_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/logistics_schema?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# auth-service JWKS contract (see auth-service/INTEGRATION.md): RS256, issuer farmatrade-auth-service,
# audience farmatrade-api. Override AUTH_JWKS_URI to http://auth-service:8081/.well-known/jwks.json
# when both services run on the same Docker network.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
auth.jwt.issuer=${AUTH_JWT_ISSUER:farmatrade-auth-service}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:farmatrade-api}

logistics.geocoding.nominatim-base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
logistics.geocoding.user-agent=${NOMINATIM_USER_AGENT:FarmaTrade-Logistics-Service/1.0 (contact: omgole100@gmail.com)}
logistics.weather.open-meteo-base-url=${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
logistics.matching.max-distance-km=${LOGISTICS_MAX_DISTANCE_KM:300}
logistics.matching.max-results=${LOGISTICS_MAX_RESULTS:3}

# Mock truck ETA: no real telematics API exists, so ETA is derived from haversine distance
# using an assumed average speed, with a floor for very-close trucks (loading time etc.).
logistics.truck.average-speed-kmh=${LOGISTICS_TRUCK_AVERAGE_SPEED_KMH:40}
logistics.truck.min-eta-minutes=${LOGISTICS_TRUCK_MIN_ETA_MINUTES:15}

# ----- Billing Service integration -----
# Logistics Service (not Bidding Service) calls Billing Service's /internal/sale once the
# buyer's accept/decline choice is known - see BillingServiceClient.
billing-service.base-url=${BILLING_SERVICE_BASE_URL:http://localhost:8085}

# STOP-GAP service-to-service credential (see bidding-service's WebClientConfig Javadoc for the
# full rationale). Must match the value bidding-service and billing-service expect.
internal-service.token=${INTERNAL_SERVICE_TOKEN:CHANGE-ME-INTERIM-SERVICE-TOKEN}

# ----- CORS (frontend origin allow-list) -----
logistics.cors.allowed-origins=${LOGISTICS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
