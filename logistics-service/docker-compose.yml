# Local dev MySQL for logistics-service. Runs via Docker only -- never point this service at a
# natively-installed MySQL. Host port note: 3306 is already taken by a natively-installed MySQL on
# this machine, 3307 is already claimed by auth-service's own docker-compose.dev.yml, and 3309 is
# billing-service's, so this maps to 3308:3306 to let all services' Docker MySQL instances run
# side by side without a port clash.
#
# Joins the shared "farmatrade-net" external network so this container can resolve auth-service
# (and vice versa) by hostname for JWKS validation. Create the network once before starting any
# service: docker network create farmatrade-net
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: logistics_schema
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - logistics-mysql-data:/var/lib/mysql
    # Deliberately NOT on farmatrade-net: every service's DB container was named "mysql" and all
    # joined the same shared network, so Docker's embedded DNS returned multiple IPs for the
    # hostname "mysql" once more than one stack was up at once -- verified empirically via
    # `docker run --network farmatrade-net busybox nslookup mysql`, which returned three different
    # container IPs (logistics/billing/lot), and a real failure where billing-service's app
    # connected to the wrong "mysql" and got "Unknown database 'farmatrade_billing'". The app
    # container only needs to reach ITS OWN db, via the project-private default network Compose
    # creates automatically for this file.

  logistics-service:
    build: .
    image: farmatrade-logistics-service:dev
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:mysql://mysql:3306/logistics_schema?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      AUTH_JWT_ISSUER: farmatrade-auth-service
      AUTH_JWT_AUDIENCE: farmatrade-api
      BILLING_SERVICE_BASE_URL: http://billing-service:8085
      # Must match the value bidding-service and billing-service send/expect as INTERNAL_SERVICE_TOKEN.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be set and must match bidding-service/billing-service}
    ports:
      - "8084:8084"
    networks:
      - farmatrade-net
      - default

volumes:
  logistics-mysql-data:

networks:
  farmatrade-net:
    external: true
