spring.application.name=billing-service

server.port=${SERVER_PORT:8085}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmatrade_billing}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
auth.jwt.issuer=${AUTH_JWT_ISSUER:farmatrade-auth-service}
auth.jwt.audience=${AUTH_JWT_AUDIENCE:farmatrade-api}

# STOP-GAP service-to-service credential (see bidding-service's WebClientConfig Javadoc for the
# full rationale). Must match the value logistics-service sends as INTERNAL_SERVICE_TOKEN.
internal-service.token=${INTERNAL_SERVICE_TOKEN:CHANGE-ME-INTERIM-SERVICE-TOKEN}

# ----- CORS (frontend origin allow-list) -----
billing.cors.allowed-origins=${BILLING_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
